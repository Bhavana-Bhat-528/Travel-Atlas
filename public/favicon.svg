<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ta-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ta-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle matching TravelAtlas brand icon -->
  <rect width="64" height="64" rx="16" fill="url(#ta-gradient)"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.95"/>
  
  <!-- Compass Cardinal Direction Ticks -->
  <line x1="32" y1="8.5" x2="32" y2="12.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="51.5" x2="32" y2="55.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8.5" y1="32" x2="12.5" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51.5" y1="32" x2="55.5" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Compass Star / Needle -->
  <!-- North pointer (Solid Crisp White) -->
  <polygon points="32,15 37.5,32 32,28.5 26.5,32" fill="#ffffff" filter="url(#ta-shadow)"/>
  <!-- South pointer (Ice Blue Tint for contrast & direction polarity) -->
  <polygon points="32,49 37.5,32 32,35.5 26.5,32" fill="#bae6fd" filter="url(#ta-shadow)"/>
  <!-- East pointer -->
  <polygon points="49,32 32,37.5 35.5,32 32,26.5" fill="#e0f2fe"/>
  <!-- West pointer -->
  <polygon points="15,32 32,37.5 28.5,32 32,26.5" fill="#bae6fd"/>

  <!-- Central Pivot Point -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="1.6" fill="#0284c7"/>
</svg>
